name: Publish approved institute photography
on:
  push:
    branches: [main]
    paths:
      - 'images/D03C9C3A-D955-4724-BF6F-272ED221DB71.png'
      - 'images/A0ED085F-D25A-4953-8ECC-2F9093648688.png'
      - 'scripts/publish_approved_images.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sound-legacy-images
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/publish_approved_images.py
      - name: Commit updated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html the-work.html give.html
          if ! git diff --cached --quiet; then
            git commit -m "Feature approved student imagery across institute site"
            git push
          fi
